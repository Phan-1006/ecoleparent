name: APK Android (parents)

on:
  push:
    branches: [main, refonte]
    tags: ['v*']
    paths:
      - 'apps/parent/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est déjà installé sur les machines ubuntu-latest de GitHub.

      - run: npm ci

      # Configuration Firebase : Settings › Secrets and variables › Actions › Variables.
      - name: Fichier .env
        run: |
          cat > .env <<ENV
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ECOLE_URL=${{ vars.VITE_ECOLE_URL }}
          VITE_PARENT_URL=${{ vars.VITE_PARENT_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID=${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_PUSH_ENABLED=${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          ENV

      - name: Compilation de l'app web
        run: npm run build -w @pe/parent

      - name: Synchronisation Capacitor
        working-directory: apps/parent
        run: npx cap sync android

      - name: google-services.json (notifications push, facultatif)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > apps/parent/android/app/google-services.json

      - name: Clé de signature (facultatif)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/parent/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Construction de l'APK
        working-directory: apps/parent/android
        run: |
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ParentEcole-$APP_VERSION.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ParentEcole-$APP_VERSION.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ParentEcole-${{ env.APP_VERSION }}
          path: ParentEcole-*.apk

      - name: Publication (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ParentEcole-*.apk
